services:
  # --------------------------------------------------
  # 1. FounderHQ FastAPI Backend API Service
  # --------------------------------------------------
  - type: web
    name: founderhq-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: ENV
        value: production
      - key: PROJECT_NAME
        value: FounderHQ-API
      - key: VERSION
        value: 1.0.0
      - key: DEBUG
        value: 'false'
      - key: PORT
        value: '8000'
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: JWT_SECRET_KEY
        generateValue: true

  # --------------------------------------------------
  # 2. FounderHQ Next.js Web Frontend Service
  # --------------------------------------------------
  - type: web
    name: founderhq-web
    env: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: founderhq-api
          property: host
