<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FounderOS — Navigation Bar Demo</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#6C63FF',
              dark: '#5b52e0',
              light: '#8B5CF6',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0F19;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-[#0B0F19] text-white antialiased min-h-screen">

  <!-- ================= STICKY GLASSMORPHISM NAVBAR (HEIGHT 80PX) ================= -->
  <header class="sticky top-0 z-50 w-full h-[80px] bg-[#0B0F19]/80 backdrop-blur-xl border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
      
      <!-- LEFT: FounderOS Logo & Text -->
      <a href="#" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#6C63FF] via-[#7C4DFF] to-[#8B5CF6] flex items-center justify-center text-white shadow-lg shadow-[#6C63FF]/30 group-hover:scale-105 transition-transform duration-300">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-white flex items-center gap-1.5">
          Founder<span class="text-[#6C63FF]">OS</span>
        </span>
      </a>

      <!-- CENTER: Navigation Links (Desktop) -->
      <nav class="hidden md:flex items-center space-x-8">
        <a href="#features" class="relative py-2 text-sm font-medium text-neutral-300 hover:text-white transition-colors duration-200 group">
          <span>Features</span>
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a href="#agents" class="relative py-2 text-sm font-medium text-neutral-300 hover:text-white transition-colors duration-200 group">
          <span>Agents</span>
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a href="#pricing" class="relative py-2 text-sm font-medium text-neutral-300 hover:text-white transition-colors duration-200 group">
          <span>Pricing</span>
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a href="#roadmap" class="relative py-2 text-sm font-medium text-neutral-300 hover:text-white transition-colors duration-200 group">
          <span>Roadmap</span>
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a href="#faq" class="relative py-2 text-sm font-medium text-neutral-300 hover:text-white transition-colors duration-200 group">
          <span>FAQ</span>
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
      </nav>

      <!-- RIGHT: Login & Get Started Buttons (Desktop) -->
      <div class="hidden md:flex items-center space-x-4">
        <a href="#login" class="px-5 py-2.5 rounded-full text-sm font-medium text-neutral-300 hover:text-white hover:bg-white/5 transition-all duration-200">
          Login
        </a>
        <a href="#get-started" class="px-6 py-2.5 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] hover:from-[#5b52e0] hover:to-[#7c4dff] shadow-lg shadow-[#6C63FF]/25 hover:shadow-[#6C63FF]/40 hover:-translate-y-0.5 active:scale-95 transition-all duration-200">
          Get Started
        </a>
      </div>

      <!-- HAMBURGER BUTTON (Mobile) -->
      <button id="menuBtn" class="md:hidden p-2 rounded-xl bg-white/5 border border-white/10 text-neutral-300 hover:text-white focus:outline-none transition-colors" aria-label="Toggle Menu">
        <svg id="hamburgerIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- MOBILE MENU DROPDOWN -->
    <div id="mobileMenu" class="hidden md:hidden absolute top-[80px] left-0 w-full bg-[#0B0F19]/95 backdrop-blur-2xl border-b border-white/10 px-6 py-6 space-y-4 shadow-2xl transition-all duration-300">
      <nav class="flex flex-col space-y-3">
        <a href="#features" class="text-base font-medium text-neutral-300 hover:text-white py-2 border-b border-white/5 transition-colors">Features</a>
        <a href="#agents" class="text-base font-medium text-neutral-300 hover:text-white py-2 border-b border-white/5 transition-colors">Agents</a>
        <a href="#pricing" class="text-base font-medium text-neutral-300 hover:text-white py-2 border-b border-white/5 transition-colors">Pricing</a>
        <a href="#roadmap" class="text-base font-medium text-neutral-300 hover:text-white py-2 border-b border-white/5 transition-colors">Roadmap</a>
        <a href="#faq" class="text-base font-medium text-neutral-300 hover:text-white py-2 border-b border-white/5 transition-colors">FAQ</a>
      </nav>

      <div class="pt-4 flex flex-col space-y-3">
        <a href="#login" class="w-full text-center py-3 rounded-full text-sm font-medium text-neutral-300 bg-white/5 border border-white/10 hover:text-white transition-all">
          Login
        </a>
        <a href="#get-started" class="w-full text-center py-3 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-[#6C63FF] to-[#8B5CF6] shadow-lg shadow-[#6C63FF]/25 hover:shadow-[#6C63FF]/40 transition-all">
          Get Started
        </a>
      </div>
    </div>
  </header>

  <!-- Vanilla JS Interactive Hamburger Script -->
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    let isOpen = false;

    menuBtn.addEventListener('click', () => {
      isOpen = !isOpen;
      if (isOpen) {
        mobileMenu.classList.remove('hidden');
        menuBtn.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        `;
      } else {
        mobileMenu.classList.add('hidden');
        menuBtn.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        `;
      }
    });
  </script>
</body>
</html>
