[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "founderhq-api"
version = "0.1.0"
description = "FastAPI Backend & Google ADK Agent Framework for FounderHQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
